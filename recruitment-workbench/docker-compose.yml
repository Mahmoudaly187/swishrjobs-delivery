services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      WEBHOOK_SECRET: dev-webhook-secret
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
